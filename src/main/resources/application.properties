spring.application.name=summer-camp-project
spring.main.web-application-type=servlet
spring.config.import=optional:file:./config/application-local.properties

# Temporary calculation result pages. The server listens on the LAN so a phone can open QR links.
server.address=${RESULT_PAGE_BIND_ADDRESS:0.0.0.0}
result-page.public-base-url=${RESULT_PAGE_PUBLIC_BASE_URL:}
result-page.port=${RESULT_PAGE_PORT:8080}
result-page.ttl=${RESULT_PAGE_TTL:30m}
server.port=${result-page.port}

# Minimal local keyword RAG. Override in config/application-local.properties for comparisons.
rag.enabled=${RAG_ENABLED:false}
rag.top-k=${RAG_TOP_K:3}
rag.min-score=${RAG_MIN_SCORE:2}
rag.max-context-chars=${RAG_MAX_CONTEXT_CHARS:2500}

# The bot is disabled by default so tests and ordinary builds never contact external services.
bot.enabled=${BOT_ENABLED:false}
bot.image-max-bytes=${BOT_IMAGE_MAX_BYTES:10485760}
bot.voice-max-bytes=${BOT_VOICE_MAX_BYTES:26214400}
bot.voice-max-duration=${BOT_VOICE_MAX_DURATION:30s}
# file: reliably send a playable MP3 attachment; native: try an iLink voice bubble.
bot.voice-reply-mode=${BOT_VOICE_REPLY_MODE:file}
bot.qr-code-path=${BOT_QR_CODE_PATH:runtime/wechat-login-qr.png}
bot.qr-code-auto-open=${BOT_QR_CODE_AUTO_OPEN:false}
bot.poll-retry-delay=${BOT_POLL_RETRY_DELAY:5s}
# 微信消息并发处理线程数；同一用户的消息仍保持串行（顺序一致）。
bot.message-pool-size=${BOT_MESSAGE_POOL_SIZE:4}
# 多轮任务断点续跑：模型工具链失败时保存请求快照，用户回复"继续"后从断点续跑。
bot.checkpoint-file=${BOT_CHECKPOINT_FILE:runtime/checkpoints.json}
# 技能待补充 / 天气待确认等临时状态的落盘位置（重启后自动恢复）。
bot.pending-skill-file=${BOT_PENDING_SKILL_FILE:runtime/pending-skills.json}
bot.pending-weather-file=${BOT_PENDING_WEATHER_FILE:runtime/pending-weather.json}
# 对话上下文落盘位置（图片字节不入库）。
conversation.history-file=${CONVERSATION_HISTORY_FILE:runtime/conversations.json}

# Zhipu BigModel. Only the API key is required; the remaining values have usable defaults.
ai.zhipu.base-url=${ZHIPU_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
ai.zhipu.chat-api-path=${ZHIPU_CHAT_API_PATH:/chat/completions}
ai.zhipu.image-api-path=${ZHIPU_IMAGE_API_PATH:/images/generations}
ai.zhipu.asr-api-path=${ZHIPU_ASR_API_PATH:/audio/transcriptions}
ai.zhipu.api-key=${ZHIPU_API_KEY:}
ai.zhipu.text-model=${ZHIPU_TEXT_MODEL:glm-4.7}
ai.zhipu.text-fallback-models=${ZHIPU_TEXT_FALLBACK_MODELS:glm-4-flash-250414}
ai.zhipu.vision-model=${ZHIPU_VISION_MODEL:glm-4.6v-flash}
ai.zhipu.vision-fallback-models=${ZHIPU_VISION_FALLBACK_MODELS:glm-4.1v-thinking-flash,glm-4v-flash}
ai.zhipu.image-model=${ZHIPU_IMAGE_MODEL:cogview-3-flash}
ai.zhipu.image-size=${ZHIPU_IMAGE_SIZE:1024x1024}
ai.zhipu.asr-model=${ZHIPU_ASR_MODEL:glm-asr-2512}
ai.zhipu.timeout=${ZHIPU_TIMEOUT:60s}
# 语音识别与图片下载使用独立更短的超时，避免拖垮主对话链路。
ai.zhipu.asr-timeout=${ZHIPU_ASR_TIMEOUT:30s}
ai.zhipu.image-timeout=${ZHIPU_IMAGE_TIMEOUT:30s}
# 工具裁剪：未命中工具触发词时只注入少量常备工具，减少普通聊天的 token 消耗。
ai.zhipu.tool-filter-enabled=${AI_TOOL_FILTER_ENABLED:true}

# Amap Web Service API. Validation is delayed until a weather query is made.
weather.amap.base-url=${AMAP_BASE_URL:https://restapi.amap.com}
weather.amap.api-key=${AMAP_API_KEY:}
weather.amap.timeout=${AMAP_TIMEOUT:10s}

# Free Microsoft Edge Read Aloud TTS. No API key is required.
speech.edge-tts.voice=${EDGE_TTS_VOICE:zh-CN-XiaoxiaoNeural}
speech.edge-tts.rate=${EDGE_TTS_RATE:+0%}
speech.edge-tts.pitch=${EDGE_TTS_PITCH:+0Hz}
speech.edge-tts.volume=${EDGE_TTS_VOLUME:+0%}
speech.edge-tts.connect-timeout=${EDGE_TTS_CONNECT_TIMEOUT:20s}

# Default push times (HH:mm, Asia/Shanghai). Each subscriber can override them via chat commands.
schedule.health-reminder=${SCHEDULE_HEALTH_REMINDER:21:00}
schedule.weather-digest=${SCHEDULE_WEATHER_DIGEST:07:30}
schedule.lunch-menu=${SCHEDULE_LUNCH_MENU:12:00}
# Where the reminder subscription table is persisted across restarts.
schedule.subscription-file=${SCHEDULE_SUBSCRIPTION_FILE:runtime/subscriptions.json}
# Where custom reminders (e.g. "提醒我明天上午10点交作业") are persisted.
schedule.reminder-file=${SCHEDULE_REMINDER_FILE:runtime/reminders.json}
